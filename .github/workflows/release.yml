name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build + Publicar release ${{ github.ref_name }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # Historial completo (fetch-depth: 0): el changelog necesita los commits
      # y tags anteriores para calcular el rango entre releases.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # jsdom 30 requiere Node >= 22.4; usamos Node 24 (LTS activo).
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Cache de las tools de bundling de Tauri (NSIS, WiX, WebView2) ──
      # `tauri build` descarga estas herramientas (~200 MB) desde
      # https://github.com/tauri-apps/binary-releases/releases en la PRIMERA
      # corrida y las guarda en %USERPROFILE%\.tauri. Sin cache, cada release
      # las baja de nuevo y GitHub devuelve 504 con frecuencia bajo carga →
      # "failed to bundle project: http status: 504".
      # Con cache, un release hit reutiliza las tools del anterior (0 descargas)
      # y el 504 deja de ser posible. restore-keys permite reusar tools aunque
      # cambie el hash del lockfile (solo se invalida al hacer upgrade del CLI).
      - name: Cache Tauri bundler tools (~/.tauri)
        uses: actions/cache@v6
        with:
          path: ~\.tauri
          key: tauri-tools-${{ runner.os }}-tauri2-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            tauri-tools-${{ runner.os }}-tauri2-

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      # Validación de paginación antes de publicar: orden (1 página Carta),
      # contrato (3-4 páginas con pie) e informe (A4) contra los fixtures, con
      # Chrome/Edge headless (incluido en windows-latest). Si una regresión de
      # layout rompiera la paginación, la release no se publica.
      - name: Test verificador de paginación (Chrome/Edge headless)
        run: node scripts/test-verificar-paginacion.mjs

      # Changelog automático: lista los commits entre el tag anterior y este
      # tag (hash corto + mensaje). Sin tag anterior (primer release), lista
      # todo el historial. El body se pasa a tauri-action como releaseBody.
      - name: Generar changelog de la release
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.ref_name }}"
          # Tag anterior por orden de versión (excluye el actual)
          PREV=$(git tag --sort=-version:refname | grep -v "^${REF}$" | head -1 || true)
          if [ -n "$PREV" ]; then
            LOG=$(git log --format='- %h %s' "${PREV}..HEAD")
            ORIGEN="desde ${PREV}"
          else
            LOG=$(git log --format='- %h %s')
            ORIGEN="todo el historial"
          fi
          [ -n "$LOG" ] || LOG="- (sin commits nuevos)"
          BODY="# Dynarent ERP ${REF}
          
          > Publicada automáticamente por GitHub Actions. Cambios ${ORIGEN} (commit ${GITHUB_SHA:0:7}).
          
          ## Cambios en esta versión
          
          ${LOG}
          
          ## Instalación
          
          - **Windows**: descarga el instalador NSIS \`*-setup.exe\` o el MSI \`*.msi\` de los assets de este release.
          - La app crea su \`config.ini\` en \`%APPDATA%\\com.corjar.dynarent\\\` en el primer arranque.
          - Requiere WebView2 Runtime (se instala automáticamente si no está presente).
          
          Ver \`SECURITY.md\` para la política de manejo de secretos y respaldo de la clave PII."
          {
            echo 'changelog<<CHANGELOG_EOF'
            echo "${BODY}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      # ── Build y publicar release con reintentos por 504 de GitHub ──
      # `tauri-action` (y `tauri build` internamente) NO reintenta las descargas
      # de NSIS/WiX/WebView2 desde github.com/tauri-apps/binary-releases: un
      # único 504 Gateway Timeout aborta el release completo con
      # "failed to bundle project: http status: 504".
      #
      # Estrategia en dos intentos (patrón estándar de retry para actions):
      #   1. Intento 1 con continue-on-error: si falla por 504 (o cualquier
      #      otro error transitorio de red), el job continúa al paso 2.
      #   2. Si el intento 1 falló, reintenta con el mismo action. El cache de
      #      ~/.tauri (arriba) suele haber descargado las tools parcialmente en
      #      el intento 1, así que el intento 2 encuentra más datos en disco.
      #   3. Si ambos fallan, el job falla explícitamente con exit 1.
      #
      # tauri-action usa createOrUpdateRelease internamente, así que un intento
      # parcial previo (release creado pero sin assets) se actualiza, no se
      # duplica. Los assets se reemplazan si ya existen.
      - name: Build y publicar release (intento 1)
        id: build_1
        uses: tauri-apps/tauri-action@v1
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Dynarent ERP ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: false

      - name: Build y publicar release (intento 2 — retry por 504)
        id: build_2
        if: steps.build_1.outcome == 'failure'
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Dynarent ERP ${{ github.ref_name }}'
          releaseBody: ${{ steps.changelog.outputs.changelog }}
          releaseDraft: false
          prerelease: false

      # Si ambos intentos fallaron, el job debe salir con error. Sin este
      # paso, GitHub marcaría el job como "success" porque el último step
      # con `if:` que se skipped cuenta como neutral.
      - name: Fallar si ambos intentos de build fallaron
        if: steps.build_1.outcome == 'failure' && steps.build_2.outcome == 'failure'
        run: |
          echo "::error::El build de Tauri falló en ambos intentos (504 de GitHub al descargar NSIS/WiX). Revisa el log del intento 2 arriba."
          exit 1
