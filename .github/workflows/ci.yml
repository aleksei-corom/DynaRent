name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Pushes consecutivos a la misma rama: el run nuevo CANCELA el anterior
# (cancel-in-progress) para no gastar minutos en pipelines obsoletos.
# Consecuencia: en una cadena de pushes rápida, solo el tope de la rama
# queda con run completo; los commits intermedios aparecen como "cancelled".
# Para verificar el CI, revisar el run del HEAD (o el del pull_request), no
# el de commits intermedios. release.yml (por tag) no usa concurrency.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Sync bun.lock para PRs de Dependabot ──
  # Dependabot actualiza `package.json` y `package-lock.json` pero NO regenera
  # `bun.lock` (limitación conocida: https://github.com/dependabot/dependabot-core/issues/8558).
  # Sin este paso, `bun install --frozen-lockfile` falla en todos los PRs de
  # Dependabot/npm_and_yarn/* con "lockfile had changes, but lockfile is frozen".
  #
  # Este job solo corre en PRs de Dependabot: regenera `bun.lock` y lo commitea
  # al PR antes de que corra `validate`. En el resto de branches/PRs se skipped
  # (sin overhead) y `validate` usa `--frozen-lockfile` normalmente.
  sync-bun-lock:
    name: Sync bun.lock (Dependabot)
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (head ref del PR con token de escritura)
        uses: actions/checkout@v7
        with:
          # head.ref del PR (Dependabot abre PRs en el mismo repo, no forks →
          # GITHUB_TOKEN puede pushear al branch).
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Regenerar bun.lock
        # --no-save: no tocar package.json (Dependabot ya lo actualizó);
        # solo resincronizar bun.lock con el package.json actual.
        run: bun install --no-save

      - name: Commit si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "bun.lock ya estaba sincronizado — nada que commitear"
          else
            git commit -m "chore: sync bun.lock con package.json (Dependabot)"
            git push
            echo "bun.lock actualizado y pusheado al PR"
          fi

  validate:
    name: Validación (lint + check + tests)
    # Depende de sync-bun-lock para que el checkout tenga el lockfile sincronizado.
    # `if: always()` + check de result permite que validate corra tanto si
    # sync-bun-lock se ejecutó (success) como si se skipped (PRs no-Dependabot).
    needs: sync-bun-lock
    if: always() && (needs.sync-bun-lock.result == 'success' || needs.sync-bun-lock.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # jsdom 30 requiere Node >= 22.4; usamos Node 24 (LTS activo).
      - name: Setup Node 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (bun)
        run: bun install --frozen-lockfile

      - name: Lint (eslint)
        run: bun run lint

      - name: Format check (prettier)
        run: bun run format:check

      # ── Security audit: CVEs conocidos en dependencias npm ──
      # npm audit consulta la base de datos del npm registry y falla si hay
      # vulnerabilidades de nivel high o critical. Usa package-lock.json (los
      # deps son los mismos que en bun.lock). --audit-level=high para no
      # bloquear el CI por low/moderate que suelen tener workaround.
      - name: npm audit (high+critical)
        run: npx npm audit --audit-level=high --omit=dev

      - name: Svelte check
        run: bunx svelte-kit sync && bunx svelte-check --tsconfig ./tsconfig.json

      - name: Frontend tests (vitest)
        run: bunx vitest run

      - name: Build producción del frontend (vite build)
        run: bun run build

      # Unit tests de la lib Rust + formateo + clippy (no requieren BD).
      - name: Rust unit tests + check + clippy + fmt
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --lib
          cargo check --all-targets

      # Tests de integración (src-tauri/tests/*.rs): se siembra una BD mínima
      # determinista con seed_ci (config → pool → migraciones → admin
      # Admin123! → 2 autos → 2 clientes) y se ejecutan completos, igual que
      # en desarrollo local. La BD va a src-tauri/../data (gitignored).
      - name: Rust tests de integración (seed_ci + ejecutar)
        working-directory: src-tauri
        run: |
          cargo run --features dev --bin seed_ci
          cargo test --tests

      # Los bins de mantenimiento (rotate_pii_key, sync_dev, dev_reset_admin)
      # usan required-features=["dev"] y quedan omitidos sin la feature:
      # comprobarlos aquí garantiza que el binario de rotación PII se chequea.
      - name: Rust check bins de mantenimiento (--features dev)
        working-directory: src-tauri
        run: cargo check --bins --features dev

      # Test del importador de datos (scripts/test_importar_autos_clientes.py):
      # unittest sin BD (parser puro). firebird-driver + cryptography solo se
      # instalan por el import del módulo (no abre BD). Python 3.12: desde
      # 3.11+ date.fromisoformat acepta formatos compactos (YYYYMMDD) — el
      # entorno donde aparece el bug del no_doc numérico que cubre el test.
      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test importador de datos (python unittest)
        run: |
          python -m pip install --quiet firebird-driver cryptography
          python scripts/test_importar_autos_clientes.py

      # Test del verificador de paginación (orden 1 página Carta, contrato
      # 3-4 páginas con pie, informe A4) — usa Chrome/Edge headless, que viene
      # instalado en windows-latest. Valida además el fix del polling del PDF.
      - name: Test verificador de paginación (Chrome/Edge headless)
        run: node scripts/test-verificar-paginacion.mjs

      # El verificador de despliegue (scripts/verificar-despliegue.ps1) valida la
      # instalación post-release en el equipo del cliente. Aquí se prueba con su modo
      # -DryRun: ejecuta los chequeos y el veredicto reales contra un ambiente simulado
      # en %TEMP% (sin instalar nada) — el caso OK debe salir con exit 0 y, con
      # -SimularFallo, el camino de FALLOS debe salir con exit 1. Se usa el shell
      # powershell (5.1), el objetivo real del script.
      - name: Verificador de despliegue (-DryRun)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\verificar-despliegue.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { throw "El caso OK (-DryRun) debio salir con exit 0, obtuvo $LASTEXITCODE" }
          powershell -ExecutionPolicy Bypass -File scripts\verificar-despliegue.ps1 -DryRun -SimularFallo
          if ($LASTEXITCODE -ne 1) { throw "-SimularFallo debio salir con exit 1 (camino FALLOS), obtuvo $LASTEXITCODE" }
          Write-Host "Verificador de despliegue: OK (exit 0) y FALLOS (exit 1) validados"
          # Sin el exit 0 explícito el paso falla: el wrapper `shell: powershell` de GitHub
          # termina con `exit $LASTEXITCODE`, y tras -SimularFallo (exit 1) el paso saldría
          # con exit 1 aunque ambos casos hayan validado.
          exit 0

  # ── Security audit: CVEs conocidos en dependencias Cargo ──
  # cargo-audit consulta la base de datos RustSec (RUSTSEC-*) y falla si
  # alguna dependencia (directa o transitiva) tiene un advisory sin mitigar.
  # No requiere compilar la app (lee Cargo.lock) → corre en paralelo con
  # validate y tarda ~30 s.
  security-audit:
    name: Security audit (cargo audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --force

      - name: Run cargo audit
        working-directory: src-tauri
        run: cargo audit
