# Dependabot — actualizaciones automáticas de dependencias
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Dependencias npm (frontend Svelte + tooling)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(deps)
    # TypeScript 7 rompe typescript-eslint (peer "typescript": ">=4.8.4 <6.1.0")
    # y SvelteKit 3 (peer "^6.0.0"). Se ignoran los MAYORS de typescript hasta
    # que el ecosistema los soporte; minors/patches siguen llegando normal.
    # Quitar este bloque cuando typescript-eslint soporte TS 7.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      svelte:
        patterns:
          - '@sveltejs/*'
          - 'svelte*'
      testing:
        patterns:
          - '@testing-library/*'
          - 'vitest*'
          - 'jsdom'
      eslint:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'typescript-eslint'

  # Dependencias Cargo (backend Rust)
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(deps)
    # rsfbclient 0.28+ NO es fusionable hoy: r2d2_firebird 0.27.0 (la última
    # publicada, sin versión superior) exige rsfbclient ^0.27.0, así que el
    # bump deja el árbol con DOS rsfbclient (0.27 vía el pool + 0.29 directo)
    # y los tipos PooledConnection/connection son incompatibles → falla la
    # compilación (ver PR #1, CI del 26-10: error en "Rust unit tests").
    # Se ignoran minors y majors; los patches 0.27.x siguen llegando.
    # Quitar este bloque cuando r2d2_firebird publique soporte para 0.28+.
    ignore:
      - dependency-name: 'rsfbclient'
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
    groups:
      firebird:
        patterns:
          - 'rsfbclient'
          - 'r2d2*'
      crypto:
        patterns:
          - 'argon2'
          - 'aes-gcm'
          - 'pbkdf2'
          - 'sha2'
          - 'hmac'
          - 'rand'

  # GitHub Actions (mantener actions actualizadas)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
